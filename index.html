/* ---------- Supabase connection & auth ---------- */
const SUPABASE_URL = "https://rriujijkraoxvraevryr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6ujTs_FNJL2ySs7pe7mX2g_vhbFFGTP";
if(!window.supabase){
  // Alguma biblioteca externa (CDN) não carregou — rede instável, bloqueio de firewall/ad-blocker, etc.

        <div style="font-size:13px;color:var(--text-dim);line-height:1.5">Uma biblioteca necessária (Supabase) não terminou de carregar — normalmente é instabilidade de internet, uma rede corporativa bloqueando o endereço, ou um bloqueador de anúncios/scripts no navegador.</div>
        <div style="font-size:13px;color:var(--text-dim);margin-top:10px">Tenta: verificar a conexão e recarregar a página. Se persistir, tenta em outra rede (ex: dados móveis) ou desativa bloqueadores de script para este site.</div>

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let USERC=null, DOWNLOADSC=null, CAN_EDIT=false, CAP_READY=false;
let AUTH_READY=false, SESSION=null, PROFILE=null;

const COL_PK = {
  obras:"codigo", fornecedores:"codigo", materiais:"codigo", estoque:"id", lotes:"id",
  requisicoes:"numero", pedidos:"numero", movimentacoes:"id", agendamentos:"id", programacao:"id",
};
function toSnakeKey(k){ return k.replace(/([A-Z])/g,(m,c)=>"_"+c.toLowerCase()); }
function toCamelKey(k){ return k.replace(/_([a-z0-9])/g,(m,c)=>c.toUpperCase()); }
function rowToSnake(obj){ const o={}; Object.keys(obj).forEach(k=>{ if(k.startsWith("_")) return; o[toSnakeKey(k)] = obj[k]===undefined?null:obj[k]; }); return o; }
function rowToCamel(row){ const o={}; Object.keys(row).forEach(k=>{ o[toCamelKey(k)] = row[k]; }); return o; }

function makeDoc(col,id){
  const pk = COL_PK[col];
  return {
    async get(){
      const { data, error } = await sb.from(col).select("*").eq(pk,id).maybeSingle();
      if(error) throw error;
      return { exists: !!data, data: ()=> data? rowToCamel(data): null };
    },
    async set(data){
      const row = rowToSnake({...data});
      row[pk] = id;
      if(col==="movimentacoes" && SESSION) row.criado_por = SESSION.user.id;
      const { error } = await sb.from(col).upsert(row, {onConflict:pk});
      if(error) throw error;
    },
    async update(data){
      const row = rowToSnake(data);
      const { error } = await sb.from(col).update(row).eq(pk,id);
      if(error) throw error;
    },
    async delete(){
      const { error } = await sb.from(col).delete().eq(pk,id);
      if(error) throw error;
    },
  };
}
function makeCollection(col){
  return {
    onSnapshot(cb){
      let channel=null, alive=true;
      async function load(){
        const { data, error } = await sb.from(col).select("*").limit(5000);
        if(!alive) return;
        if(error){ console.error("load failed",col,error); cb([]); return; }
        cb((data||[]).map(r=>({ id:r[COL_PK[col]], data:()=>rowToCamel(r) })));
      }
      load();
      try{
        channel = sb.channel("rt_"+col)
          .on("postgres_changes", {event:"*", schema:"public", table:col}, ()=>{ load(); })
          .subscribe();
      }catch(e){ console.error("realtime subscribe failed",col,e); }
      return ()=>{ alive=false; try{ if(channel) sb.removeChannel(channel); }catch(e){} };
    }
  };
}
const DBC = { collection:makeCollection, doc:(path)=>{ const i=path.indexOf("/"); return makeDoc(path.slice(0,i), path.slice(i+1)); } };

let PERFIL_ERRO = null;
async function carregarPerfil(userId){
  PERFIL_ERRO = null;
  try{
    const { data, error, status, statusText } = await sb.from("profiles").select("*").eq("id",userId).maybeSingle();
    if(error){ PERFIL_ERRO = `[${status||"?"}] ${error.message||statusText||"erro desconhecido"}${error.hint?(" — "+error.hint):""}`; throw error; }
    if(data){ PROFILE = { nome:data.nome, role:data.role }; CAN_EDIT = ["admin","almoxarifado"].includes(data.role); return; }
    // Sessão "fantasma": o token no navegador aponta pra um usuário que não existe mais
    // em profiles (ex.: conta recriada). Em vez de assumir 'campo' em silêncio, encerra
    // a sessão velha para forçar um login limpo com o usuário atual.
    PERFIL_ERRO = "Nenhuma linha em profiles para este uid (0 resultados, sem erro de permissão).";
    console.warn(PERFIL_ERRO);
    PROFILE = null;
    try{ await sb.auth.signOut(); }catch(e){}
    SESSION = null;
  }catch(e){ console.error("perfil falhou",e); if(!PERFIL_ERRO) PERFIL_ERRO = String((e&&e.message)||e); PROFILE = { nome:"", role:"campo" }; CAN_EDIT = false; }
}

function mostrarErroFatal(msg){
  try{
    const el = document.getElementById('app');
    if(!el) return;
    el.dataset.hasContent = "1";
    el.innerHTML = `<div style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px">
      <div class="card" style="max-width:460px;padding:22px;border-left:4px solid var(--bad)">
        <div class="display" style="font-weight:700;font-size:15px;margin-bottom:8px">Não foi possível conectar ao sistema</div>
        <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5;word-break:break-word">${esc(String(msg||'Erro desconhecido'))}</div>
        <div style="font-size:12.5px;color:var(--text-dim);margin-top:10px">Verifique a conexão com a internet e tente novamente. Se o problema persistir, confirme com o administrador se o projeto Supabase está ativo.</div>
        <button class="btn btn-primary" style="margin-top:14px" onclick="location.reload()">Tentar novamente</button>
      </div>
    </div>`;
  }catch(e){ console.error("falha ao exibir erro fatal",e); }
}
async function initAuth(){
  try{
    const { data:{ session }, error: sessErr } = await sb.auth.getSession();
    if(sessErr) throw sessErr;
    SESSION = session||null;
    if(SESSION) await carregarPerfil(SESSION.user.id);
    AUTH_READY = true;
    CAP_READY = true;
    boot();
    sb.auth.onAuthStateChange(async (event, newSession)=>{
      try{
        SESSION = newSession||null;
        if(SESSION){
          await carregarPerfil(SESSION.user.id);
          if(!booted){ booted=true; await startSubscriptions(); await maybeSeed(); }
        } else {
          PROFILE=null; booted=false;
          UNSUBS.forEach(u=>{try{u()}catch(e){}}); UNSUBS=[];
          Object.keys(STATE.loaded).forEach(k=>STATE.loaded[k]=false);
        }
        render();
      }catch(e){ console.error("onAuthStateChange falhou",e); mostrarErroFatal((e&&e.message)||e); }
    });
  }catch(e){
    console.error("initAuth falhou",e);
    mostrarErroFatal((e&&e.message)||e);
  }
}
initAuth();
window.addEventListener('unhandledrejection', function(ev){

/* ---------- Utilities ---------- */
const uid = (p="id")=> p+"-"+Math.random().toString(36).slice(2,9);
// Usa o dia/mês/ano LOCAL do dispositivo (não UTC) — importante porque toISOString()
// converte para UTC e, à noite no horário do Brasil (UTC-3), já "vira" o dia seguinte.
const todayISO = ()=>{
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
function fmtDateBR(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function parseISO(iso){ return iso? new Date(iso+"T00:00:00") : null; }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtNum(n,dec=0){ if(n===null||n===undefined||isNaN(n)) return "—"; return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function groupBy(arr,fn){ const m={}; arr.forEach(x=>{ const k=fn(x); (m[k]=m[k]||[]).push(x); }); return m; }
function sum(arr,fn){ return arr.reduce((a,x)=>a+(Number(fn(x))||0),0); }
function toast(msg,kind="info"){

  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .25s"; setTimeout(()=>el.remove(),260); },3400);
}
function monthLabel(ym){ const [y,m]=ym.split("-"); const names=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"]; return names[+m-1]+"/"+y.slice(2); }
function ymOf(iso){ return iso? iso.slice(0,7) : null; }

/* ---------- Classificação única de situação de estoque ----------
   Fonte única da verdade: toda tela/relatório/alerta do sistema chama ESTA função
   para classificar um material. Nunca duplicar essa regra em outro lugar.
   Regra: compara o DISPONÍVEL (saldo - reservado) contra o Mínimo cadastrado.
   Igualdade (disponível == mínimo) conta como "De acordo" (usa "<", nunca "<="). */
const SITUACAO_ESTOQUE = { ZERO:"🔴 Sem estoque", BAIXO:"🟠 Abaixo do mínimo", OK:"🟢 De acordo" };
const SITUACAO_COR = { [SITUACAO_ESTOQUE.ZERO]:"bad", [SITUACAO_ESTOQUE.BAIXO]:"warn", [SITUACAO_ESTOQUE.OK]:"good" };
function calcDisponivel(e){ return (e&&e.saldoAtual||0) - (e&&e.reservado||0); }
function calcSituacaoEstoque(disponivel, minimo){
  const saldo = Number(disponivel) || 0;

  // Estoque zerado ou negativo
  if (saldo <= 0) return SITUACAO_ESTOQUE.ZERO;

  // Verifica se existe mínimo cadastrado e ativo (nulo/vazio/0/negativo = "sem mínimo configurado")
  const minimoInformado = minimo !== null && minimo !== undefined && String(minimo).trim() !== "";
  const limite = minimoInformado ? Number(minimo) : null;

  if (!minimoInformado || !Number.isFinite(limite) || limite <= 0) return SITUACAO_ESTOQUE.OK;

  if (saldo < limite) return SITUACAO_ESTOQUE.BAIXO;

  return SITUACAO_ESTOQUE.OK;
}
function situacaoCellRenderer(v){ return pill(v, SITUACAO_COR[v]||"info"); }

  loaded:{obras:false,fornecedores:false,materiais:false,estoque:false,requisicoes:false,movimentacoes:false,pedidos:false,agendamentos:false,lotes:false,programacao:false},

let UNSUBS = [];

function allLoaded(){ return Object.values(STATE.loaded).every(Boolean); }

function normalizeDocs(snap){
  // Defensive normalizer: supports a plain array of docs, or a {docs:[...]} wrapper,
  // and a document's data either as a plain object field or a data() accessor.
  const arr = Array.isArray(snap) ? snap : (snap && Array.isArray(snap.docs) ? snap.docs : []);
  return arr.map(d=>{
    const data = typeof d.data === "function" ? d.data() : (d.data || {});
    return {_id: d.id, _v: d.version!==undefined? d.version : d.updatedAt, ...data};
  });
}
function subscribe(col, target){
  if(!DBC){ return; }
  try{
    const unsub = DBC.collection(col).onSnapshot((snap)=>{
      STATE[target] = normalizeDocs(snap);
      STATE.loaded[target]=true;
      render();
    });
    UNSUBS.push(unsub);
  }catch(e){ console.error("subscribe failed",col,e); STATE.loaded[target]=true; }
}

async function startSubscriptions(){
  if(!DBC){
    Object.keys(STATE.loaded).forEach(k=>STATE.loaded[k]=true);
    render();
    return;
  }
  subscribe("obras","obras");
  subscribe("fornecedores","fornecedores");
  subscribe("materiais","materiais");
  subscribe("estoque","estoque");
  subscribe("requisicoes","requisicoes");
  subscribe("movimentacoes","movimentacoes");
  subscribe("pedidos","pedidos");
  subscribe("agendamentos","agendamentos");
  subscribe("lotes","lotes");
  subscribe("programacao","programacao");
  setTimeout(()=>{ // failsafe: stop showing skeleton after 10s even if a collection is empty/unavailable
    Object.keys(STATE.loaded).forEach(k=>{ if(!STATE.loaded[k]) STATE.loaded[k]=true; });
    render();
  },10000);
}

}

/* ---------- Lotes / Validade (PEPS-FIFO / FEFO) ---------- */
function lotesOf(obra,material){
  return STATE.lotes.filter(l=>l.obra===obra && l.material===material && (l.quantidade||0)>0.0001)
    .sort((a,b)=>{
      const va = a.validade||"9999-12-31", vb = b.validade||"9999-12-31";
      if(va!==vb) return va<vb?-1:1;
      return (a.dataEntrada||"").localeCompare(b.dataEntrada||"");
    });
}
function diasParaVencer(validade){ return validade? daysBetween(todayISO(), validade) : null; }
function statusValidade(validade){
  if(!validade) return {label:"Sem validade", color:"info"};
  const d = diasParaVencer(validade);
  if(d===null) return {label:"Sem validade", color:"info"};
  if(d<0) return {label:"Vencido", color:"bad"};
  if(d<=30) return {label:`Vence em ${d}d`, color:"warn"};
  return {label:`Vence em ${d}d`, color:"good"};
}
async function registrarEntradaLote({obra,material,lote,quantidade,validade,fornecedor,pc}){
  const loteCodigo = (lote && lote.trim()) ? lote.trim() : ("SEM-LOTE-"+todayISO());
  const id = `${obra}_${material}_${loteCodigo}`.replace(/[^\w\-]/g,"_");
  const existente = STATE.lotes.find(l=>l._id===id);
  const novaQtd = (existente? Number(existente.quantidade)||0 : 0) + Number(quantidade);
  await dbSet("lotes", id, {
    obra, material, lote:loteCodigo, quantidade:novaQtd,
    validade: validade || (existente? existente.validade : null),
    dataEntrada: existente? existente.dataEntrada : todayISO(),
    fornecedor: fornecedor || (existente? existente.fornecedor: null),
    pc: pc || (existente? existente.pc : null),
  });
}
async function consumirLotesFIFO(obra,material,quantidadeNecessaria){
  let restante = Number(quantidadeNecessaria);
  const lotes = lotesOf(obra,material);
  const consumidos = [];
  for(const l of lotes){
    if(restante<=0.0001) break;
    const disponivel = Number(l.quantidade)||0;
    const consumir = Math.min(disponivel, restante);
    if(consumir<=0) continue;
    await dbMerge("lotes", l._id, {quantidade: Math.round((disponivel-consumir)*100)/100});
    consumidos.push({lote:l.lote, qtd:consumir, validade:l.validade||null});
    restante -= consumir;
  }
  if(restante>0.0001){
    consumidos.push({lote:"(sem lote identificado)", qtd: Math.round(restante*100)/100, validade:null});
  }
  return consumidos;
}
function lotesVisiveis(){ const obs=filteredObras(); return STATE.lotes.filter(l=>obs.includes(l.obra) && (l.quantidade||0)>0.0001); }

  if(!DBC){ toast("Banco de dados indisponível nesta visualização.","error"); return false; }
  try{ await DBC.doc(`${col}/${id}`).set(data); return true; }
  catch(e){ console.error(e); toast("Não foi possível salvar: "+(e&&e.message||e),"error"); return false; }
}
async function dbMerge(col,id,data){
  if(!DBC){ toast("Banco de dados indisponível nesta visualização.","error"); return false; }
  try{ await DBC.doc(`${col}/${id}`).update ? await DBC.doc(`${col}/${id}`).update(data) : await DBC.doc(`${col}/${id}`).set(data,{merge:true}); return true; }
  catch(e){
    try{ await DBC.doc(`${col}/${id}`).set(data,{merge:true}); return true; }
    catch(e2){ console.error(e2); toast("Não foi possível salvar: "+(e2&&e2.message||e2),"error"); return false; }
  }
}
async function dbDelete(col,id){
  if(!DBC){ toast("Banco de dados indisponível nesta visualização.","error"); return false; }
  try{ await DBC.doc(`${col}/${id}`).delete(); return true; }
  catch(e){ console.error(e); toast("Não foi possível excluir.","error"); return false; }
}

async function registrarMovimentacao({obra,material,tipo,quantidade,lote,validade,responsavel,aplicacao,rm,observacao,origemOverride,fotoAssetId}){
  // Retirada/entrada é a função principal do papel "campo" — não bloquear por CAN_EDIT aqui.
  // Quem pode editar cadastros, requisições, pedidos etc. continua controlado por CAN_EDIT nos respectivos formulários.
  quantidade = Math.abs(Number(quantidade)||0);
  if(quantidade<=0){ toast("Informe uma quantidade válida.","error"); return false; }
  let est = estoqueOf(obra,material);
  const saldoAtual = est? Number(est.saldoAtual)||0 : 0;
  const delta = tipo==="entrada" ? quantidade : -quantidade;
  if(tipo==="saida" && saldoAtual+delta < 0){
    const ok = confirm(`Atenção: saldo ficará negativo (${fmtNum(saldoAtual)} → ${fmtNum(saldoAtual+delta)}). Confirmar mesmo assim?`);
    if(!ok) return false;
  }
  // No Supabase, o banco (trigger fn_aplicar_movimentacao) é quem cria/baixa o lote
  // pelo FIFO/FEFO e ajusta o saldo de estoque automaticamente ao inserir a movimentação.
  const movId = uid("mov");
  const movData = {obra,material,tipo,quantidade,lote:lote||"", validade: validade||null, data: todayISO(), responsavel: responsavel||"—", aplicacao: aplicacao||"", origem: origemOverride || (rm? "rm" : "manual"), rm: rm||null, observacao: observacao||""};
  const ok1 = await dbSet("movimentacoes", movId, movData);
  if(!ok1) return false;
  toast(`${tipo==="entrada"?"Entrada":"Saída"} registrada: ${quantidade} ${materialByCode(material).unidade} de ${material}.`,"success");
  const novoSaldo = saldoAtual + delta;
  const novoDisponivel = novoSaldo - (est? Number(est.reservado)||0 : 0);
  const m = materialByCode(material);
  if(tipo==="saida" && m.critico && calcSituacaoEstoque(novoDisponivel, est?est.minimo:0)!==SITUACAO_ESTOQUE.OK){
    toast(`⚠ Material crítico ${material} abaixo do estoque mínimo!`,"error");
  }
  return true;
}

async function mudarStatusRM(rm, novoStatus){
  const patch = {status:novoStatus};
  const stamp = new Date().toISOString();
  if(novoStatus==="validacao") patch.validadaEm = stamp;
  if(novoStatus==="aguardando_compra") patch.aprovadaEm = stamp;
  if(novoStatus==="pedido_emitido") patch.pedidoEmitidoEm = stamp;
  if(novoStatus==="atendida") patch.atendidaEm = stamp;
  if(novoStatus==="parcial") patch.parcialEm = stamp;
  const ok = await dbMerge("requisicoes", rm.numero, patch);
  if(ok) toast(`RM ${rm.numero} → ${rmStatusCfg(novoStatus).label}`, "success");
}

function consumoAgregado(f){
  const movs = movimentacoesVisiveis().filter(m=>m.tipo==="saida"&&f.mov(m));
  const byMat = groupBy(movs, m=>m.material);
  return Object.entries(byMat).map(([mat,list])=>({"Material":mat,"Nome":materialByCode(mat).nome,"Categoria":materialByCode(mat).categoria,"Qtd Consumida":sum(list,x=>x.quantidade),"UN":materialByCode(mat).unidade}));
}
function criticosRows(f){
  return estoqueVisivel().filter(e=>materialByCode(e.material).critico && f.mat(e)).map(e=>{
    const movs = movimentacoesVisiveis().filter(m=>m.material===e.material && m.tipo==="saida");
    const months = new Set(movs.map(m=>ymOf(m.data)));
    const consumoMedioMes = months.size? sum(movs,m=>m.quantidade)/months.size : 0;
    // Disponível = saldo menos o que já está reservado (reservado já tem destino certo, não "sobra" de verdade).
    const disponivel = (e.saldoAtual||0)-(e.reservado||0);
    const consumoDia = consumoMedioMes/30;
    const cobertura = consumoDia>0 ? Math.round(disponivel/consumoDia) : "—";
    const situacao = calcSituacaoEstoque(disponivel, e.minimo);
    const reposicaoSug = situacao!==SITUACAO_ESTOQUE.OK ? Math.max((e.seguranca||0)-disponivel, (e.minimo||0)) : 0;
    const prevEsgot = (consumoDia>0 && cobertura!=="—") ? new Date(Date.now()+cobertura*86400000).toISOString().slice(0,10) : null;
    return {
      "Obra":e.obra,"Material":e.material,"Nome":materialByCode(e.material).nome,
      "Saldo Atual":e.saldoAtual||0, "Reservado":e.reservado||0, "Disponível": disponivel,
      "Est. Mínimo":e.minimo||0, "Est. Segurança":e.seguranca||0,
      "Desvio Mín.": disponivel-(e.minimo||0), "Cons./dia": Math.round(consumoDia*10)/10,
      "Cobertura (d)": cobertura, "Prev. Esgot.": prevEsgot? fmtDateBR(prevEsgot):"—",
      "Reposição Sug.": Math.round(reposicaoSug), "Situação": situacao,
    };
  });
}
function pcRow(p){
  return {"PC":p.numero,"Obra":p.obra,"Fornecedor":fornecedorByCode(p.fornecedor).nome,"Emissão":fmtDateBR(p.emissao),"Previsão":fmtDateBR(p.previsaoEntrega),"Entrega Real":p.entregaReal?fmtDateBR(p.entregaReal):"—","Status":pcStatusCfg(p.status).label,"Atraso (d)":pcAtrasoDias(p)};
}
function comprasPorFornecedor(f){
  const pcs = pedidosVisiveis().filter(f.pc);
  const byF = groupBy(pcs, p=>p.fornecedor);
  return Object.entries(byF).map(([fid,list])=>{
    const entregues = list.filter(p=>p.entregaReal);
    const leadTimes = entregues.map(p=>daysBetween(p.emissao,p.entregaReal)).filter(x=>x!==null);
    const atrasados = list.filter(p=>pcAtrasoDias(p)>0 || (p.entregaReal && daysBetween(p.previsaoEntrega,p.entregaReal)>0));
    return {
      "Fornecedor": fornecedorByCode(fid).nome, "Origem": fornecedorByCode(fid).cidade+"/"+fornecedorByCode(fid).uf,
      "Pedidos": list.length, "Entregues": entregues.length, "Pendentes": list.filter(p=>p.status==="pendente").length,
      "Atrasados": atrasados.length, "Lead Time Médio (d)": leadTimes.length? Math.round(sum(leadTimes,x=>x)/leadTimes.length):0,
      "Índice Atraso (%)": list.length? Math.round(atrasados.length/list.length*1000)/10 : 0,
    };
  });
}
function desempenhoKPIs(f){
  const rms = requisicoesVisiveis().filter(f.rm);
  const concl = rms.filter(r=>r.status==="atendida");
  const leadTotal = concl.map(r=>daysBetween(r.abertura, r.atendidaEm? r.atendidaEm.slice(0,10) : null)).filter(x=>x!==null);
  const leadAprov = rms.map(r=>daysBetween(r.abertura, r.validadaEm? r.validadaEm.slice(0,10): (r.aprovadaEm? r.aprovadaEm.slice(0,10):null))).filter(x=>x!==null&&x>=0);
  const leadCompra = rms.map(r=>daysBetween(r.aprovadaEm? r.aprovadaEm.slice(0,10):r.abertura, r.pedidoEmitidoEm? r.pedidoEmitidoEm.slice(0,10):null)).filter(x=>x!==null&&x>=0);
  const pcs = pedidosVisiveis();
  const leadEntrega = pcs.filter(p=>p.entregaReal).map(p=>daysBetween(p.emissao,p.entregaReal));
  const noPrazo = rms.filter(r=>r.status==="atendida" && rmAtrasoDias(r)===0).length;
  const atrasadas = rms.filter(r=>rmAtrasoDias(r)>0).length;
  const atendPeloEstoque = rms.filter(r=>r.status==="atendida" && !r.pedido).length;
  const atendPorCompra = rms.filter(r=>r.status==="atendida" && r.pedido).length;
  const totalAtend = atendPeloEstoque+atendPorCompra;
  const avg = arr=> arr.length? Math.round(sum(arr,x=>x)/arr.length*10)/10 : 0;
  return {
    tempo_atendimento: avg(leadTotal), tempo_aprovacao: avg(leadAprov), tempo_compra: avg(leadCompra), tempo_entrega: avg(leadEntrega),
    pct_prazo: rms.length? Math.round(noPrazo/rms.length*1000)/10 : 0,
    pct_atraso: rms.length? Math.round(atrasadas/rms.length*1000)/10 : 0,
    idx_proprio: totalAtend? Math.round(atendPeloEstoque/totalAtend*1000)/10 : 0,
    idx_externo: totalAtend? Math.round(atendPorCompra/totalAtend*1000)/10 : 0,
    total: rms.length, concluidas: concl.length,
  };
}

function temaAtual(){
  const attr = document.documentElement.getAttribute('data-theme');
  if(attr==='dark' || attr==='light') return attr;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function aplicarTema(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('tema', theme); }catch(e){}

  const prox = temaAtual()==='dark' ? 'light' : 'dark';

function conclusoesAutomaticas(est,rms,pcs,kpi){
  const out=[];
  const abaixoMin = est.filter(e=>calcSituacaoEstoque(calcDisponivel(e),e.minimo)===SITUACAO_ESTOQUE.BAIXO);
  if(abaixoMin.length) out.push(`${abaixoMin.length} posição(ões) de estoque estão abaixo do mínimo configurado — priorizar reposição de ${abaixoMin.slice(0,3).map(e=>e.material).join(", ")}${abaixoMin.length>3?"…":""}.`);
  else out.push("Nenhuma posição de estoque abaixo do mínimo no momento.");
  const atrasadas = rms.filter(r=>rmAtrasoDias(r)>0);
  out.push(atrasadas.length? `${atrasadas.length} requisição(ões) estão com prazo de previsão vencido.` : "Todas as requisições em andamento estão dentro do prazo previsto.");
  const pcAtraso = pcs.filter(p=>pcAtrasoDias(p)>0);

  out.push(`Índice de atendimento pelo estoque próprio: ${kpi.idx_proprio}% · por compras externas: ${kpi.idx_externo}%.`);
  return out;
}

function gerarResumoDoDia(){
  const hoje = todayISO();
  const obraLabel = VFILTER.obra==="todas" ? "1306 + 1344" : VFILTER.obra;
  const movsHoje = movimentacoesVisiveis().filter(m=>m.data===hoje);
  const entradas = movsHoje.filter(m=>m.tipo==="entrada");
  const saidas = movsHoje.filter(m=>m.tipo==="saida");
  const crit = criticosRows({mat:()=>true}).filter(r=>r["Situação"]!==SITUACAO_ESTOQUE.OK);
  const rmAtrasadas = requisicoesVisiveis().filter(r=>rmAtrasoDias(r)>0);
  const rmAguardando = requisicoesVisiveis().filter(r=>["aberta","aguardando_compra","aguardando_entrega"].includes(r.status));
  const pcAtrasados = pedidosVisiveis().filter(p=>pcAtrasoDias(p)>0);

  let t = `*ALMOXARIFADO GUANDU — Resumo do dia*\n`;
  t += `Obra ${obraLabel} · ${new Date().toLocaleDateString('pt-BR')}\n\n`;

  t += `*📦 Movimentações de hoje*\n`;
  if(!movsHoje.length) t += `Nenhuma movimentação registrada ainda.\n`;
  else{
    if(saidas.length){ t += `Saídas (${saidas.length}):\n`; saidas.forEach(m=> t += `• ${m.material} — ${fmtNum(m.quantidade)} ${materialByCode(m.material).unidade} (${m.aplicacao||m.origem})\n`); }
    if(entradas.length){ t += `Entradas (${entradas.length}):\n`; entradas.forEach(m=> t += `• ${m.material} — ${fmtNum(m.quantidade)} ${materialByCode(m.material).unidade}\n`); }
  }

  t += `\n*⚠️ Materiais críticos em alerta* (${crit.length})\n`;
  if(!crit.length) t += `Nenhum — estoque crítico sob controle.\n`;
  else crit.slice(0,10).forEach(r=> t += `• ${r.Material} (${r.Obra}) — saldo ${fmtNum(r["Saldo Atual"])} / mínimo ${fmtNum(r["Est. Mínimo"])} — ${r["Situação"]}\n`);

  t += `\n*📋 Requisições em aberto* (${rmAguardando.length})\n`;
  if(!rmAguardando.length) t += `Nenhuma pendência.\n`;
  else rmAguardando.slice(0,10).forEach(r=> t += `• ${r.numero} — ${r.aplicacao} — prev. ${fmtDateBR(r.previsao)}${rmAtrasoDias(r)>0?` (ATRASADA ${rmAtrasoDias(r)}d)`:''}\n`);

  if(pcAtrasados.length){
    t += `\n*🚚 Pedidos de compra atrasados* (${pcAtrasados.length})\n`;
    pcAtrasados.forEach(p=> t += `• ${p.numero} — ${fornecedorByCode(p.fornecedor).nome} — ${pcAtrasoDias(p)}d de atraso\n`);
  }
  t += `\n_Gerado automaticamente pelo sistema._`;
  return t;
}

function wirePainel(){

  // não carregar (ex: CDN bloqueado pela rede), os botões continuam funcionando.

  try{
  const palette = getComputedStyle(document.documentElement);
  const c = v=>palette.getPropertyValue(v).trim();

  // Consumo mensal
  const movs = movimentacoesVisiveis().filter(m=>m.tipo==="saida");
  const months = [...new Set(movs.map(m=>ymOf(m.data)))].sort().slice(-6);
  const topMats = Object.entries(groupBy(movs,m=>m.material)).sort((a,b)=>sum(b[1],x=>x.quantidade)-sum(a[1],x=>x.quantidade)).slice(0,5).map(x=>x[0]);

        label: mat, data: months.map(ym=> sum(movs.filter(m=>m.material===mat&&ymOf(m.data)===ym),x=>x.quantidade)),
        backgroundColor: [c('--accent'),c('--info'),c('--good'),c('--warn'),c('--bad')][i%5],
      }))
    }, options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{color:c('--text-dim'),boxWidth:10,font:{size:10}}}}, scales:{x:{ticks:{color:c('--text-dim')},grid:{display:false}}, y:{ticks:{color:c('--text-dim')},grid:{color:c('--border')}}}}
    });

  // Criticos pizza

  const ctx2 = document.getElementById('chart-criticos-pizza');
  if(ctx2){
    chartRefs.criticos = new Chart(ctx2, {type:'doughnut', data:{
      labels:Object.keys(counts), datasets:[{data:Object.values(counts), backgroundColor:[c('--good'),c('--warn'),c('--bad')]}]
    }, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:c('--text-dim'),boxWidth:10,font:{size:10}}}}}});
  }
  // RM status

  const ctx3 = document.getElementById('chart-rm-status');
  if(ctx3){
    chartRefs.rmstatus = new Chart(ctx3, {type:'bar', data:{labels:RM_STATUS.map(s=>s.label), datasets:[{data:byStatus, backgroundColor:c('--accent')}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:c('--text-dim')},grid:{color:c('--border')}},y:{ticks:{color:c('--text-dim'),font:{size:10}},grid:{display:false}}}}});
  }
  // Fornecedor lead
  const cf = comprasPorFornecedor({pc:()=>true});
  const ctx4 = document.getElementById('chart-fornecedor-lead');
  if(ctx4){
    chartRefs.fornlead = new Chart(ctx4, {type:'bar', data:{labels:cf.map(x=>x.Fornecedor), datasets:[{label:'Lead time (d)',data:cf.map(x=>x["Lead Time Médio (d)"]),backgroundColor:c('--info')},{label:'Índice atraso (%)',data:cf.map(x=>x["Índice Atraso (%)"]),backgroundColor:c('--bad')}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:c('--text-dim'),boxWidth:10,font:{size:10}}}},scales:{x:{ticks:{color:c('--text-dim'),font:{size:9}},grid:{display:false}},y:{ticks:{color:c('--text-dim')},grid:{color:c('--border')}}}}});

function programacaoMaterialOptionsHTML(rm, existing){
  if(!rm) return STATE.materiais.map(m=>`<option value="${m.codigo}" ${existing&&existing.material===m.codigo?'selected':''}>${m.codigo} — ${esc(m.nome)}</option>`).join("");
  const pendentes = (rm.itens||[]).filter(i=>(i.atendido||0) < i.qtd);
  let itens = pendentes;
  // Garante que o material já salvo apareça na lista mesmo se, por algum motivo, já não estiver mais pendente.
  if(existing && existing.material && !itens.some(i=>i.material===existing.material)){
    const item = (rm.itens||[]).find(i=>i.material===existing.material);
    if(item) itens = [...itens, item];
  }
  if(!itens.length) return `<option value="">Nenhum item pendente nesta RM</option>`;
  return itens.map(i=>`<option value="${i.material}" ${existing&&existing.material===i.material?'selected':''}>${i.material} — ${esc(materialByCode(i.material).nome)} (faltam ${fmtNum(i.qtd-(i.atendido||0))})</option>`).join("");
}
function openModalProgramacao(existing){
  const pendingRMs = STATE.requisicoes.filter(r=>!["atendida","cancelada"].includes(r.status));
  const rmInicial = existing&&existing.rm ? pendingRMs.find(r=>r.numero===existing.rm) : null;
  openModal(`
    ${modalHeader(existing? "Editar Atividade Programada" : "Nova Atividade Programada")}
    <form id="form-programacao" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label class="field-label">Obra</label><select name="obra" id="prog-obra-select" ${rmInicial?'disabled':''}>${obrasAtivas().map(o=>`<option value="${o.codigo}" ${existing&&existing.obra===o.codigo?'selected':''}>${o.codigo} — ${esc(o.nome)}</option>`).join("")}</select></div>
      <div><label class="field-label">Data</label><input type="date" name="data" value="${existing?existing.data:todayISO()}" required></div>
      <div style="grid-column:span 2"><label class="field-label">Vincular à Requisição (RM) em aberto — opcional</label>
        <select name="rm" id="prog-rm-select">
          <option value="">Nenhuma — atividade avulsa</option>
          ${pendingRMs.map(r=>`<option value="${r.numero}" ${existing&&existing.rm===r.numero?'selected':''}>${r.numero} — ${esc(r.aplicacao||'')} (${r.obra})</option>`).join("")}
        </select>
        <div style="font-size:11px;color:var(--text-faint);margin-top:3px">Ao escolher uma RM, a retirada feita a partir desta atividade atualiza o atendimento dela automaticamente.</div>
      </div>
      <div style="grid-column:span 2"><label class="field-label">Material</label>
        <select name="material" id="prog-material-select" required><option value="">Selecione…</option>${programacaoMaterialOptionsHTML(rmInicial, existing)}</select>
      </div>
      <div><label class="field-label">Quantidade prevista</label><input type="number" min="0.01" step="0.01" name="quantidadePrevista" id="prog-qtd-input" value="${existing?existing.quantidadePrevista:''}" required></div>
      <div><label class="field-label">Responsável / Equipe</label><input name="responsavel" value="${existing?esc(existing.responsavel||''):''}" placeholder="Ex: Equipe Munck" list="equipe-lista-prog">${nomesDatalistHTML('equipe-lista-prog', EQUIPE_MOVIMENTACAO)}</div>
      <div style="grid-column:span 2"><label class="field-label">Observação (opcional)</label><input name="observacao" value="${existing?esc(existing.observacao||''):''}" placeholder="Ex: Carregar antes das 10h"></div>
      ${existing? `<div style="grid-column:span 2"><label style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="checkbox" name="concluido" ${existing.concluido?'checked':''} style="width:auto"> Marcar como concluída</label></div>` : ""}
      <div style="grid-column:span 2;display:flex;justify-content:flex-end;gap:8px;margin-top:6px"><button type="button" class="btn btn-ghost" data-close-modal>Cancelar</button><button type="submit" class="btn btn-primary">${existing?'Salvar Alterações':'Criar Atividade'}</button></div>
    </form>
  `);
  wireModalClose();
  const rmSelect = document.getElementById('prog-rm-select');
  const obraSelect = document.getElementById('prog-obra-select');
  const matSelect = document.getElementById('prog-material-select');
  const qtdInput = document.getElementById('prog-qtd-input');
  rmSelect.onchange = ()=>{
    const rm = pendingRMs.find(r=>r.numero===rmSelect.value) || null;
    if(rm){ obraSelect.value = rm.obra; obraSelect.disabled = true; }
    else { obraSelect.disabled = false; }
    matSelect.innerHTML = `<option value="">Selecione…</option>${programacaoMaterialOptionsHTML(rm, null)}`;
    if(rm){
      const primeiroPendente = (rm.itens||[]).find(i=>(i.atendido||0) < i.qtd);
      if(primeiroPendente){
        matSelect.value = primeiroPendente.material;
        qtdInput.value = primeiroPendente.qtd - (primeiroPendente.atendido||0);
      }
    }
  };
  const fProg = document.getElementById('form-programacao');
  fProg.onsubmit = async(e)=>{
    e.preventDefault();
    if(fProg.dataset.enviando==="1") return;
    const __btn = fProg.querySelector('[type="submit"]');
    fProg.dataset.enviando = "1"; if(__btn) __btn.disabled = true;
    try{
      const fd = new FormData(e.target);
      const id = existing? existing._id : uid("prg");
      const ok = await dbSet("programacao", id, {
        obra: fd.get('obra'), data: fd.get('data'), material: fd.get('material'),
        quantidadePrevista: Number(fd.get('quantidadePrevista'))||0,
        responsavel: fd.get('responsavel')||"", observacao: fd.get('observacao')||"",
        rm: fd.get('rm')||null,
        concluido: existing? fd.get('concluido')==="on" : false,
      });
      if(ok){ toast(existing?"Atividade atualizada.":"Atividade programada criada.","success"); closeModal(); }
    } finally {
      fProg.dataset.enviando = ""; if(__btn) __btn.disabled = false;
    }
  };
}

let currentReportId = "rm_todas";
let reportFilterState = { periodoIni:"", periodoFim:"", material:"", categoria:"", critico:"todos", fornecedor:"", numRM:"", numPC:"", responsavel:"", solicitante:"", aplicacao:"", status:"", tipoMov:"", situacaoEntrega:"" };

function currentFilterFns(){
  const fs = reportFilterState;
  const inPeriodo = (iso)=>{
    if(!iso) return true;
    if(fs.periodoIni && iso<fs.periodoIni) return false;
    if(fs.periodoFim && iso>fs.periodoFim) return false;
    return true;
  };
  return {
    rm: (r)=>{
      if(fs.material && !(r.itens||[]).some(i=>i.material===fs.material)) return false;
      if(fs.critico!=="todos"){ const hasCrit=(r.itens||[]).some(i=>materialByCode(i.material).critico); if(fs.critico==="sim"&&!hasCrit) return false; if(fs.critico==="nao"&&hasCrit) return false; }
      if(fs.numRM && !r.numero.toLowerCase().includes(fs.numRM.toLowerCase())) return false;
      if(fs.numPC && !(r.pedido||"").toLowerCase().includes(fs.numPC.toLowerCase())) return false;
      if(fs.responsavel && !r.responsavel.toLowerCase().includes(fs.responsavel.toLowerCase())) return false;
      if(fs.solicitante && !r.solicitante.toLowerCase().includes(fs.solicitante.toLowerCase())) return false;
      if(fs.aplicacao && !r.aplicacao.toLowerCase().includes(fs.aplicacao.toLowerCase())) return false;
      if(fs.status && r.status!==fs.status) return false;
      if(!inPeriodo(r.abertura)) return false;
      return true;
    },
    mat: (e)=>{
      const mat = materialByCode(e.material);
      if(fs.material && e.material!==fs.material) return false;
      if(fs.categoria && mat.categoria!==fs.categoria) return false;
      if(fs.critico!=="todos"){ if(fs.critico==="sim"&&!mat.critico) return false; if(fs.critico==="nao"&&mat.critico) return false; }
      return true;
    },
    mov: (m)=>{
      const mat = materialByCode(m.material);
      if(fs.material && m.material!==fs.material) return false;
      if(fs.categoria && mat.categoria!==fs.categoria) return false;
      if(fs.critico!=="todos"){ if(fs.critico==="sim"&&!mat.critico) return false; if(fs.critico==="nao"&&mat.critico) return false; }
      if(fs.tipoMov && m.tipo!==fs.tipoMov) return false;
      if(!inPeriodo(m.data)) return false;
      return true;
    },
    pc: (p)=>{
      if(fs.fornecedor && p.fornecedor!==fs.fornecedor) return false;
      if(fs.numPC && !p.numero.toLowerCase().includes(fs.numPC.toLowerCase())) return false;
      if(fs.status && p.status!==fs.status) return false;
      if(fs.situacaoEntrega && p.status!==fs.situacaoEntrega) return false;
      if(!inPeriodo(p.emissao)) return false;
      return true;
    },
  };
}

function wireRelatorios(){
  document.querySelectorAll('[data-report]').forEach(el=>el.onclick=()=>{ currentReportId = el.dataset.report; render(); });
  ["periodoIni","periodoFim","material","categoria","critico","fornecedor","numRM","numPC","responsavel","solicitante","aplicacao","status","tipoMov","situacaoEntrega"].forEach(k=>{

    if(el && (el.tagName==="INPUT") && el.type!=="date") el.oninput = debounce(()=>{ reportFilterState[k]=el.value; },300);
  });
  const ap = document.querySelector('[data-action="aplicar-filtros"]'); if(ap) ap.onclick=()=>render();
  const lim = document.querySelector('[data-action="limpar-filtros"]'); if(lim) lim.onclick=()=>{ Object.keys(reportFilterState).forEach(k=>reportFilterState[k]= (k==='critico')?'todos':''); render(); };

  const report = REPORTS.find(r=>r.id===currentReportId);
  if(report && report.chart) renderReportChart(report);

  document.querySelectorAll('[data-export]').forEach(el=>el.onclick=()=>exportCurrentReport(el.dataset.export));

  const formAg = document.getElementById('form-agendamento');
  if(formAg) formAg.onsubmit = async(e)=>{
    e.preventDefault();
    if(formAg.dataset.enviando==="1") return;
    const __btn = formAg.querySelector('[type="submit"]');
    formAg.dataset.enviando = "1"; if(__btn) __btn.disabled = true;
    try{
      const fd=new FormData(formAg);
      const data = {relatorio:fd.get('relatorio'), obra:fd.get('obra'), frequencia:fd.get('frequencia'), horario:fd.get('horario'), formato:fd.get('formato'), destinatarios:fd.get('destinatarios'), ativo:true, ultimaExecucao:null, criadoEm:new Date().toISOString()};

      formAg.dataset.enviando = ""; if(__btn) __btn.disabled = false;
    }
  };
  document.querySelectorAll('[data-exec-agenda]').forEach(el=>el.onclick=async()=>{
    const ag = STATE.agendamentos.find(a=>a._id===el.dataset.execAgenda); if(!ag) return;

    else exportPDF(rep.title, rows, rep.title.replace(/\s+/g,"_"));
    await dbMerge("agendamentos", ag._id, {ultimaExecucao:new Date().toISOString()});
    toast(`Relatório "${rep.title}" gerado para: ${ag.destinatarios}`,"success");
  });
  document.querySelectorAll('[data-del-agenda]').forEach(el=>el.onclick=async()=>{ if(confirm("Excluir agendamento?")) await dbDelete("agendamentos", el.dataset.delAgenda); });
}

function exportCurrentReport(kind){
  const report = REPORTS.find(r=>r.id===currentReportId);
  if(!report) return;
  const f = currentFilterFns();
  let rows = report.rows ? report.rows(f).map(({_raw,...r})=>r) : [];
  if(!rows.length && !report.chart && !report.kpi){ toast("Nenhum dado para exportar.","error"); return; }
  const filename = report.title.replace(/[^\wÀ-ÿ]+/g,"_");
  if(kind==="xlsx") exportXLSX(rows, filename);
  if(kind==="csv") exportCSV(rows, filename);
  if(kind==="pdf") exportPDF(report.title, rows, filename);
}

/* ---------- Export engines ---------- */
async function saveBlob(filename, blob){
  if(DOWNLOADSC){
    try{ const buf = await blob.arrayBuffer(); await DOWNLOADSC.save({filename, data:buf}); toast("Arquivo gerado: "+filename,"success"); return; }catch(e){ console.error(e); }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function exportCSV(rows, filename){
  if(!rows.length){ toast("Nenhum dado para exportar.","error"); return; }
  const cols = Object.keys(rows[0]);
  const esc2 = v=> `"${String(v===undefined||v===null?"":v).replace(/"/g,'""')}"`;
  const lines = [cols.map(esc2).join(";"), ...rows.map(r=>cols.map(c=>esc2(r[c])).join(";"))];
  const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  saveBlob(filename+".csv", blob);
}
function exportXLSX(rows, filename){
  if(!rows.length){ toast("Nenhum dado para exportar.","error"); return; }
  if(typeof XLSX==="undefined"){ toast("Biblioteca de Excel indisponível.","error"); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Relatorio");
  const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  saveBlob(filename+".xlsx", new Blob([out], {type:"application/octet-stream"}));
}
function exportBackupCompleto(){
  if(typeof XLSX==="undefined"){ toast("Biblioteca de Excel indisponível — verifique a conexão e recarregue.","error"); return; }
  const tabelas = [
    ["Obras", STATE.obras],
    ["Fornecedores", STATE.fornecedores],
    ["Materiais", STATE.materiais],
    ["Estoque", STATE.estoque],
    ["Lotes", STATE.lotes],
    ["Requisicoes", STATE.requisicoes.map(r=>({...r, itens: JSON.stringify(r.itens||[])}))],
    ["Pedidos", STATE.pedidos.map(p=>({...p, itens: JSON.stringify(p.itens||[])}))],
    ["Movimentacoes", STATE.movimentacoes.map(m=>({...m, lotesConsumidos: JSON.stringify(m.lotesConsumidos||[])}))],
    ["Programacao", STATE.programacao],
  ];
  const wb = XLSX.utils.book_new();
  let temAlgo = false;
  tabelas.forEach(([nome, rows])=>{
    const limpo = (rows||[]).map(r=>{ const o={...r}; delete o._id; return o; });
    const ws = XLSX.utils.json_to_sheet(limpo.length? limpo : [{"(vazio)":""}]);
    XLSX.utils.book_append_sheet(wb, ws, nome.slice(0,31));
    if(limpo.length) temAlgo = true;
  });
  if(!temAlgo){ toast("Ainda não há dados carregados para fazer backup.","error"); return; }
  const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  const agora = new Date();
  const stamp = todayISO()+"_"+String(agora.getHours()).padStart(2,"0")+String(agora.getMinutes()).padStart(2,"0");
  saveBlob(`backup_almoxarifado_guandu_${stamp}.xlsx`, new Blob([out], {type:"application/octet-stream"}));
  toast("Backup completo gerado — guarde este arquivo em local seguro (ex: Google Drive, OneDrive).","success");
}
function exportPDF(title, rows, filename){
  if(typeof window.jspdf==="undefined"){ toast("Biblioteca de PDF indisponível.","error"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: rows.length && Object.keys(rows[0]).length>6 ? "landscape":"portrait", unit:"pt"});
  doc.setFontSize(14); doc.text(title, 32, 32);
  doc.setFontSize(9); doc.setTextColor(120); doc.text(`Obra ${VFILTER.obra==="todas"?"1306 / 1344":VFILTER.obra} — Emitido em ${new Date().toLocaleString('pt-BR')}`, 32, 48);
  if(rows.length){
    doc.autoTable({ startY:60, head:[Object.keys(rows[0])], body: rows.map(r=>Object.values(r).map(v=>v===undefined||v===null?"—":String(v))), styles:{fontSize:7.5}, headStyles:{fillColor:[14,116,144]} });
  } else {
    doc.setTextColor(0); doc.text("Nenhum registro encontrado para os filtros selecionados.", 32, 70);
  }
  saveBlob(filename+".pdf", doc.output("blob"));
}

        <div id="pc-itens">${itensIniciais.map((i,idx)=>itemRowHTML(i,idx)).join("")}</div>
        <button type="button" class="btn btn-ghost btn-sm" id="add-item-pc" style="margin-top:6px">+ Adicionar item</button>
      </div>
      ${pc? `<div><label class="field-label">Status</label><select name="status"><option value="pendente" ${pc.status==='pendente'?'selected':''}>Pendente</option><option value="entregue" ${pc.status==='entregue'?'selected':''}>Entregue</option><option value="atrasado" ${pc.status==='atrasado'?'selected':''}>Atrasado</option><option value="cancelado" ${pc.status==='cancelado'?'selected':''}>Cancelado</option></select></div>
      <div><label class="field-label">Data de Entrega Real</label><input type="date" name="entregaReal" value="${pc.entregaReal||''}"></div>
      <div style="grid-column:span 2"><label class="field-label">Validade do lote recebido (opcional, aplica-se a todos os itens deste recebimento)</label><input type="date" name="validadeLote"></div>`:""}
      <div style="grid-column:span 2;display:flex;justify-content:flex-end;gap:8px;margin-top:6px"><button type="button" class="btn btn-ghost" data-close-modal>Cancelar</button><button type="submit" class="btn btn-primary">${pc?'Salvar':'Criar Pedido'}</button></div>
    </form>
  `);
  wireModalClose();
  document.getElementById('add-item-pc').onclick=()=>{ document.getElementById('pc-itens').insertAdjacentHTML('beforeend', itemRowHTML({material:"",qtd:""})); wireItemRemovers(); };
  wireItemRemovers();
  const fPc = document.getElementById('form-pc');
  fPc.onsubmit = async(e)=>{
    e.preventDefault();
    if(fPc.dataset.enviando==="1") return;
    const __btn = fPc.querySelector('[type="submit"]');
    fPc.dataset.enviando = "1"; if(__btn) __btn.disabled = true;
    try{
      const fd=new FormData(e.target);
      const mats=fd.getAll('item-material'), qtds=fd.getAll('item-qtd');
      const itens = mats.map((m,i)=>({material:m,qtd:Number(qtds[i])||0})).filter(i=>i.material&&i.qtd>0);
      const numero = pc? pc.numero : `PC-${new Date().getFullYear()}-${String(Math.floor(1000+Math.random()*9000))}`;
      const entregaReal = fd.get('entregaReal')||null;
      let status = fd.get('status') || 'pendente';
      if(!pc && !entregaReal) status='pendente';
      const data = {numero, obra: fd.get('obra'), fornecedor:fd.get('fornecedor'), itens, emissao:fd.get('emissao'), previsaoEntrega:fd.get('previsaoEntrega'), entregaReal, status};
      const ok = await dbSet("pedidos", numero, data);
      if(ok){
        if(entregaReal && (!pc || pc.entregaReal!==entregaReal)){
          const validadeLote = fd.get('validadeLote')||null;
          for(const it of itens){ await registrarMovimentacao({obra:data.obra, material:it.material, tipo:'entrada', quantidade:it.qtd, lote:numero, validade:validadeLote, responsavel:"Recebimento", observacao:"Recebimento do pedido "+numero}); }
        }
        toast(pc?"Pedido atualizado.":"Pedido criado: "+numero,"success"); closeModal();
      }
    } finally {
      fPc.dataset.enviando = ""; if(__btn) __btn.disabled = false;
    }
  };
}
