name: Backup Diário Almoxarifado

on:
  schedule:
    # 06:00 no horário de Brasília (UTC-3) = 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # também permite rodar manualmente, pelo botão "Run workflow" no GitHub

permissions:
  contents: write  # precisa poder salvar o arquivo de volta no repositório

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Rodar o backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/backup.mjs

      - name: Apagar backups com mais de 90 dias (evita o repositório crescer para sempre)
        run: find backups -name "backup_*.json" -mtime +90 -delete

      - name: Salvar o backup no repositório
        run: |
          git config user.name "Backup Robô"
          git config user.email "backup-robo@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Backup automático $(date -u +%Y-%m-%d)"
          git push
